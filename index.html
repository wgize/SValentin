      let finalStyle = styles;
      let openComment = false;
      let isOn = true;
      let compiledStyles = "";
      let styleTag = document.getElementById("style-tag");
      let styleText = document.getElementById("style-text");

      const commentTime = 35; // Tiempo para comentarios (más lento para leer)
      const codeTime = 0.2; // Tiempo para código

      function writeStyleChar(char) {
        // Detectar inicio de comentario
        if (char === "/" && openComment === false) {
          openComment = true;
          compiledStyles += char;
        }
        // Detectar fin de comentario
        else if (char === "/" && openComment === true) {
          openComment = false;
          compiledStyles = compiledStyles.replace(
            /(\/[^\/]*\*)$/,
            '<em class="comment">$1/</em>',
          );
        }
        // Wrap style declaration
        else if (char === ":") {
          compiledStyles = compiledStyles.replace(
            /([a-zA-Z- ^\n]*)$/,
            '<em class="key">$1</em>:',
          );
        }
        // Wrap style value
        else if (char === ";") {
          compiledStyles = compiledStyles.replace(
            /([^:]*)$/,
            '<em class="value">$1</em>;',
          );
        }
        // Wrap selector
        else if (char === "{") {
          compiledStyles = compiledStyles.replace(
            /([^\n]*)$/,
            '<em class="selector">$1</em>{',
          );
        } else {
          compiledStyles += char;
        }

        styleText.innerHTML = compiledStyles;
        styleTag.textContent += char;
      }

      function writeStyles(message, index, interval) {
        if (index < message.length && isOn) {
          const pre = document.getElementById("style-text");
          pre.scrollTop = pre.scrollHeight;

          writeStyleChar(message[index]);
          index++;

          setTimeout(() => {
            writeStyles(message, index, openComment ? commentTime : codeTime);
          }, interval);
        } else if (index >= message.length) {
          // Cuando termine la animación, iniciar ECG
          setTimeout(() => {
            startECG();
          }, 500);
        }
      }

        isOn = false;
        setTimeout(() => {
          styleText.innerHTML = finalStyle;
          styleTag.textContent = finalStyle;
          const pre = document.getElementById("style-text");
          pre.scrollTop = pre.scrollHeight;

          // Activar todas las animaciones inmediatamente
          startECG();
        }, 2 * commentTime);
      }

      let currentSong = 0;

      const audio = document.getElementById("audio-player");
      const playBtn = document.getElementById("play-btn");
      const songTitle = document.getElementById("song-title");
      const volumeSlider = document.getElementById("volume-slider");

      function loadSong(index) {
        audio.src = songs[index].file;

      function togglePlay() {

          audio.pause();

        currentSong = (currentSong - 1 + songs.length) % songs.length;
        loadSong(currentSong);
        if (isPlaying) audio.play();
      }

      document.getElementById("play-btn").addEventListener("click", togglePlay);
      document.getElementById("next-btn").addEventListener("click", nextSong);
      document.getElementById("prev-btn").addEventListener("click", prevSong);

      volumeSlider.addEventListener("input", (e) => {
        audio.volume = e.target.value / 100;
      });

      audio.addEventListener("ended", nextSong);
      audio.volume = 0.7;
      loadSong(0);

      // ====================
      // ANIMACIÓN ECG
      // ====================
      let ecgAnimationRunning = false;

      function startECG() {
        if (ecgAnimationRunning) return;
        ecgAnimationRunning = true;

        const container = document.getElementById("ecg-container");
        const path = document.getElementById("ecg-path");

        if (!path) {
          console.error("ECG path not found");
          return;
        }

        let x = 0;
        const width = 600;
        const centerY = 100;

        function animateECG() {
          if (!ecgAnimationRunning) return;

          x = (x + 3) % width;

          let pathData = `M0,${centerY}`;
          for (let i = 0; i <= width; i += 3) {
            const pos = (i + x) % width;
            let y = centerY;

            const cycle = pos % 300;
            if (cycle >= 0 && cycle < 10) {
              y = centerY;
            } else if (cycle >= 10 && cycle < 20) {
              y = centerY - 5;
            } else if (cycle >= 20 && cycle < 30) {
              y = centerY - 50;
            } else if (cycle >= 30 && cycle < 40) {
              y = centerY + 70;
            } else if (cycle >= 40 && cycle < 50) {
              y = centerY - 25;
            } else if (cycle >= 50 && cycle < 60) {
              y = centerY + 10;
            } else if (cycle >= 60 && cycle < 70) {
              y = centerY;
            } else {
              y = centerY;
            }

            pathData += ` L${i},${y}`;
          }

          try {
            path.setAttribute("d", pathData);
          } catch (e) {
            console.error("Error setting path:", e);
            ecgAnimationRunning = false;
            return;
          }

          requestAnimationFrame(animateECG);
        }

        animateECG();
      }

      // ====================
      // GALERÍA POLAROID
      // ====================
      function initPolaroidGallery() {
        const polaroids = document.querySelectorAll(".polaroid");
        const prevBtn = document.getElementById("polaroid-prev");
        const nextBtn = document.getElementById("polaroid-next");
        let activeIndex = -1;

        function showNavigationButtons() {
          prevBtn.classList.add("visible");
          nextBtn.classList.add("visible");
        }

        function hideNavigationButtons() {
          prevBtn.classList.remove("visible");
          nextBtn.classList.remove("visible");
        }

        function activatePolaroid(index) {
          polaroids.forEach((p) => p.classList.remove("active"));
          polaroids[index].classList.add("active");
          activeIndex = index;
          showNavigationButtons();
        }

        function deactivatePolaroid() {
          polaroids.forEach((p) => p.classList.remove("active"));
          activeIndex = -1;
          hideNavigationButtons();
        }

        function goToPrevious() {
          if (activeIndex === -1) return;
          const newIndex =
            (activeIndex - 1 + polaroids.length) % polaroids.length;
          activatePolaroid(newIndex);
        }

        function goToNext() {
          if (activeIndex === -1) return;
          const newIndex = (activeIndex + 1) % polaroids.length;
          activatePolaroid(newIndex);
        }

        // Click en polaroid
        polaroids.forEach((polaroid, index) => {
          polaroid.addEventListener("click", function (e) {
            e.stopPropagation();

            // Si ya está activa, cerrarla
            if (activeIndex === index) {
              deactivatePolaroid();
            } else {
              activatePolaroid(index);
            }
          });
        });

        // Botones de navegación
        prevBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          goToPrevious();
        });

        nextBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          goToNext();
        });

        // Cerrar al hacer click fuera
        document.addEventListener("click", function (e) {
          if (
            activeIndex !== -1 &&
            !e.target.closest(".polaroid") &&
            !e.target.closest(".polaroid-nav")
          ) {
            deactivatePolaroid();
          }
        });

        // Navegar con teclas de flecha
        document.addEventListener("keydown", function (e) {
          if (activeIndex === -1) return;

          if (e.key === "ArrowLeft") {
            goToPrevious();
          } else if (e.key === "ArrowRight") {
            goToNext();
          } else if (e.key === "Escape") {
            deactivatePolaroid();
          }
        });
      }

      // ====================
      // INICIALIZACIÓN
      // ====================
      document.getElementById("skipAnimation").addEventListener("click", skip);

      // Iniciar la animación después de un breve delay
      setTimeout(() => {
        writeStyles(styles, 0, commentTime);
      }, 500);

      // Inicializar galería polaroid
      initPolaroidGallery();
    </script>
  </body>
</html>
